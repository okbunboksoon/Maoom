<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DITA Validation Check</title>
    <link rel="stylesheet" href="/user/css/RevisionPopup.css">
    <style>
        body{min-width:800px}.ber-popup-body{height:100vh;overflow:hidden}.ber-popup-body .revision-page{box-sizing:border-box;height:100vh;display:flex;flex-direction:column;padding-bottom:24px}.validation-panel{width:100%;margin:18px 0 0;font-size:14px;flex:1;min-height:0;display:flex;flex-direction:column}.validation-grid{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:center}.validation-grid select{width:100%;min-width:0;padding:9px;font-size:14px;border:1px solid #cbd5e1;border-radius:6px}.validation-grid>label:not([for]){display:flex;align-items:center;gap:6px}.validation-grid input[type="checkbox"]{width:auto;height:auto;margin:0;flex:0 0 auto}.schematron-options{display:flex;align-items:center;gap:24px;min-height:36px}.schematron-option{display:flex;align-items:center;gap:6px;min-width:0;cursor:pointer}.schematron-option input{width:auto;height:auto;margin:0}.schematron-option strong{color:#334155}.schematron-option span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#64748b}.schematron-option.unavailable{cursor:not-allowed;opacity:.55}.tree-section-header{display:flex;align-items:center;justify-content:space-between;margin:16px 0 10px}.tree-section-header h3{margin:0}.tree-controls{display:flex;gap:6px}.tree-controls button{padding:5px 10px;border:1px solid #cbd5e1;border-radius:5px;background:#fff;color:#475569;font-size:12px;cursor:pointer}.tree-controls button:hover{background:#f1f5f9}.tree-box{height:auto;min-height:0;flex:1;overflow:auto;border:1px solid #d8dee8;border-radius:6px;background:#fff}.tree-header,.tree-row{display:grid;grid-template-columns:46px 72px minmax(320px,1fr) 220px;align-items:center}.tree-header{position:sticky;top:0;z-index:2;min-height:42px;background:#f8fafc;border-bottom:1px solid #d8dee8;color:#475569;font-size:13px;font-weight:700}.tree-header>span,.tree-row>span{padding:8px 10px}.tree-row{min-height:38px;border-bottom:1px solid #edf0f4;color:#475569;font-size:13px}.tree-row:hover{background:#f6f9fd}.tree-row.level-1{background:#eef5ff;border-left:4px solid #4b82d0;border-top:1px solid #cbdcf3;color:#244f87}.tree-row.level-1 .tree-title-text{font-weight:700}.tree-row.level-1 .tree-level{color:#244f87}.tree-row.selected{background:#fff7d6;color:#7a5700}.tree-check-cell{text-align:center}.tree-check{width:16px;height:16px}.tree-level{display:flex;align-items:center;color:#3978d1;font-weight:700}.tree-title{display:flex;align-items:center;min-width:0}.tree-branch{color:#94a3b8;margin-right:10px}.tree-toggle{width:20px;margin:0 6px 0 0;padding:0;border:0;background:transparent;color:#3978d1;font:inherit;line-height:1;cursor:pointer}.tree-toggle:hover{color:#1f5fbf}.tree-toggle-placeholder{display:inline-block;width:20px;margin-right:6px;flex:0 0 20px}.tree-row[hidden]{display:none}.tree-title-text,.tree-file{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tree-file{color:#64748b}.result-panel{margin-top:12px}.result-actions{margin-top:10px}.result-actions [hidden]{display:none!important}.path-value{word-break:break-all;color:#475569}.popup-actions{margin-top:12px}
    </style>
</head>
<body class="ber-popup-body">
<!-- 2단계: ditamap, 검사 범위, DOCS/PUB 규칙과 트리 항목을 선택하여 검사를 실행한다. -->
<main class="revision-page">
    <header class="revision-header">
        <div><h1>DITA Validation Check</h1><p id="inputPathLabel" class="path-value"></p></div>
    </header>
    <section class="revision-panel validation-panel">
        <div class="validation-grid">
            <label for="mapSelect">ditamap</label><select id="mapSelect"></select>
            <label for="scopeSelect">검사 범위</label>
            <select id="scopeSelect">
                <option value="ALL">ditamap 전체 검사 (항목 선택 불필요)</option>
                <option value="SELECTED_ONLY">선택한 항목만</option>
                <option value="SELECTED_WITH_DESCENDANTS">선택한 항목과 모든 자손</option>
            </select>
            <span>검사 유형</span><div id="schematronOptions" class="schematron-options">불러오는 중...</div>
            <span>옵션</span><label><input id="validateMap" type="checkbox" checked> ditamap 자체 검사</label>
        </div>
        <div class="tree-section-header">
            <h3>ditamap 트리</h3>
            <div class="tree-controls"><button id="collapseAllBtn" type="button">전체 접기</button><button id="expandAllBtn" type="button">전체 펼치기</button></div>
        </div>
        <div id="treeBox" class="tree-box">불러오는 중...</div>
        <footer class="popup-actions"><button id="runBtn" class="action-button primary" type="button">검사 실행</button><button class="action-button" type="button" onclick="window.close()">취소</button></footer>
        <section id="resultPanel" class="result-panel" hidden>
            <div class="result-heading"><span id="statusIndicator" class="status-indicator"></span><strong id="resultTitle"></strong></div>
            <p id="resultMessage"></p>
            <div class="result-actions"><button id="openReportBtn" class="action-button primary" type="button" hidden>결과 보기</button></div>
        </section>
    </section>
</main>
<script>
// 화면은 긴 검사 POST 요청을 유지하면서 progressToken으로 별도 진행 상태 API를 주기적으로 조회한다.
const inputPath=new URLSearchParams(location.search).get('inputPath')||'',mapSelect=document.getElementById('mapSelect'),scopeSelect=document.getElementById('scopeSelect'),schematronOptions=document.getElementById('schematronOptions'),treeBox=document.getElementById('treeBox'),openReportBtn=document.getElementById('openReportBtn');let treeNodeSequence=0,reportUrl='';
document.getElementById('inputPathLabel').textContent=inputPath;mapSelect.onchange=loadTree;scopeSelect.onchange=syncDescendantChecks;document.getElementById('runBtn').onclick=runValidation;openReportBtn.onclick=()=>{if(reportUrl)window.open(reportUrl,'_blank','noopener')};document.getElementById('collapseAllBtn').onclick=()=>setAllTreeCollapsed(true);document.getElementById('expandAllBtn').onclick=()=>setAllTreeCollapsed(false);loadSchematrons();loadMaps();
async function post(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw new Error(await r.text());return r.json()}
async function loadSchematrons(){const runButton=document.getElementById('runBtn');try{const response=await fetch('/api/dita-validation/schematrons');if(!response.ok)throw new Error(await response.text());const choices=await response.json();schematronOptions.innerHTML='';choices.forEach(choice=>{const label=document.createElement('label');label.className='schematron-option'+(choice.available?'':' unavailable');const radio=document.createElement('input');radio.type='radio';radio.name='schematronType';radio.value=choice.type;radio.disabled=!choice.available;if(choice.available&&!schematronOptions.querySelector('input:checked'))radio.checked=true;const name=document.createElement('strong');name.textContent=choice.label;const file=document.createElement('span');file.textContent=choice.fileName||(choice.validationMessage||'사용 가능한 파일 없음');label.append(radio,name,file);schematronOptions.appendChild(label)});const available=schematronOptions.querySelector('input[name="schematronType"]:checked');runButton.disabled=!available;if(!available)show('error','Schematron 없음','DOCS_CHECK_v* 또는 PUB_CHECK_v* 형식의 유효한 .sch 파일을 추가해 주세요.')}catch(e){runButton.disabled=true;schematronOptions.textContent='조회 실패';show('error','Schematron 조회 실패',e.message)}}
async function loadMaps(){try{const maps=await post('/api/dita-validation/maps',{inputPath});mapSelect.innerHTML='';maps.forEach(m=>{const o=document.createElement('option');o.value=m.path;o.textContent=m.name;mapSelect.appendChild(o)});if(maps.length)await loadTree()}catch(e){show('error','ditamap 조회 실패',e.message)}}
async function loadTree(){treeBox.textContent='불러오는 중...';try{const data=await post('/api/dita-validation/tree',{mapPath:mapSelect.value});renderTree(data.roots)}catch(e){treeBox.textContent=e.message}}
function renderTree(nodes){treeNodeSequence=0;treeBox.innerHTML='<div class="tree-header"><span>선택</span><span>계층</span><span>Title</span><span>파일명</span></div>';appendTreeRows(nodes,1,null);setAllTreeCollapsed(true)}
// 선택 항목과 모든 자손 범위에서는 부모 체크 상태를 화면의 모든 하위 항목에도 동일하게 반영한다.
function updateTreeToggle(row,collapsed){const toggle=row.querySelector('.tree-toggle');if(!toggle)return;toggle.textContent=collapsed?'▶':'▼';toggle.setAttribute('aria-expanded',String(!collapsed));const title=row.querySelector('.tree-title-text')?.textContent||'제목 없음';toggle.setAttribute('aria-label',title+' 하위 내용 '+(collapsed?'펼치기':'접기'))}
function directChildRows(nodeKey){return treeBox.querySelectorAll('.tree-row[data-parent-key="'+nodeKey+'"]')}
function setRowChecked(row,checked){const checkbox=row.querySelector('.tree-check');if(checkbox)checkbox.checked=checked;row.classList.toggle('selected',checked)}
function setDescendantChecks(nodeKey,checked){directChildRows(nodeKey).forEach(child=>{setRowChecked(child,checked);setDescendantChecks(child.dataset.nodeKey,checked)})}
function syncDescendantChecks(){if(scopeSelect.value!=='SELECTED_WITH_DESCENDANTS')return;treeBox.querySelectorAll('.tree-row').forEach(row=>{if(row.querySelector('.tree-check:checked'))setDescendantChecks(row.dataset.nodeKey,true)})}
function handleTreeCheck(row,checked){row.classList.toggle('selected',checked);if(scopeSelect.value==='SELECTED_WITH_DESCENDANTS')setDescendantChecks(row.dataset.nodeKey,checked)}
function hideTreeDescendants(nodeKey){directChildRows(nodeKey).forEach(child=>{child.hidden=true;hideTreeDescendants(child.dataset.nodeKey)})}
function restoreTreeDescendants(nodeKey){directChildRows(nodeKey).forEach(child=>{child.hidden=false;if(!child.classList.contains('collapsed'))restoreTreeDescendants(child.dataset.nodeKey)})}
function setTreeNodeCollapsed(row,collapsed){row.classList.toggle('collapsed',collapsed);updateTreeToggle(row,collapsed);if(collapsed)hideTreeDescendants(row.dataset.nodeKey);else restoreTreeDescendants(row.dataset.nodeKey)}
function setAllTreeCollapsed(collapsed){treeBox.querySelectorAll('.tree-row').forEach(row=>{if(row.querySelector('.tree-toggle')){row.classList.toggle('collapsed',collapsed);updateTreeToggle(row,collapsed)}row.hidden=collapsed&&row.dataset.parentKey!==''})}
function appendTreeRows(nodes,level,parentKey){nodes.forEach(n=>{const nodeKey='node-'+(++treeNodeSequence),row=document.createElement('div'),hasChildren=!!(n.children&&n.children.length);row.className='tree-row'+(level===1?' level-1':' tree-descendant');row.dataset.nodeKey=nodeKey;row.dataset.parentKey=parentKey||'';const checkCell=document.createElement('span');checkCell.className='tree-check-cell';const check=document.createElement('input');check.type='checkbox';check.value=n.id;check.className='tree-check';check.setAttribute('aria-label',(n.title||'제목 없음')+' 선택');check.addEventListener('change',()=>handleTreeCheck(row,check.checked));checkCell.appendChild(check);const levelCell=document.createElement('span');levelCell.className='tree-level';if(hasChildren){const toggle=document.createElement('button');toggle.type='button';toggle.className='tree-toggle';toggle.textContent='▼';toggle.setAttribute('aria-expanded','true');toggle.addEventListener('click',()=>setTreeNodeCollapsed(row,!row.classList.contains('collapsed')));levelCell.append(toggle,document.createTextNode('L'+level))}else{const placeholder=document.createElement('span');placeholder.className='tree-toggle-placeholder';levelCell.append(placeholder,document.createTextNode('L'+level))}const titleCell=document.createElement('span');titleCell.className='tree-title';titleCell.style.paddingLeft=(10+(level-1)*24)+'px';const branch=document.createElement('span');branch.className='tree-branch';branch.textContent=level>1?'–':'·';const title=document.createElement('span');title.className='tree-title-text';title.textContent=n.title||'(제목 없음)';titleCell.append(branch,title);const fileCell=document.createElement('span');fileCell.className='tree-file';fileCell.textContent=fileName(n.href);row.append(checkCell,levelCell,titleCell,fileCell);treeBox.appendChild(row);if(hasChildren)appendTreeRows(n.children,level+1,nodeKey)})}
function fileName(href){if(!href)return '-';const clean=href.split('#')[0].replace(/\\/g,'/');return clean.substring(clean.lastIndexOf('/')+1)||href}
function newProgressToken(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2)}
// 현재 파일과 완료 수가 계속 바뀌는지 보여 주어 네트워크 파일 대기와 정상 진행을 구분할 수 있게 한다.
async function pollProgress(token){try{const response=await fetch('/api/dita-validation/progress/'+encodeURIComponent(token),{cache:'no-store'});if(!response.ok)return;const progress=await response.json();if(progress.status!=='RUNNING'||!progress.total)return;const current=progress.currentFile?' / 현재: '+progress.currentFile:'';const updated=progress.updatedAt?' / 마지막 처리: '+new Date(progress.updatedAt).toLocaleTimeString('ko-KR'):'';show('running','Schematron 검사 중',progress.completed+' / '+progress.total+'개 검사 완료'+current+updated)}catch(e){}}
async function runValidation(){const button=document.getElementById('runBtn'),selected=[...document.querySelectorAll('.tree-check:checked')].map(x=>x.value),selectedType=document.querySelector('input[name="schematronType"]:checked'),progressToken=newProgressToken();let progressTimer=null;reportUrl='';openReportBtn.hidden=true;if(!selectedType){show('error','검사 유형 필요','원고 또는 퍼블리싱 검사 유형을 선택해 주세요.');return}button.disabled=true;button.textContent='검사 중...';show('running','Schematron 검사 중','검사 파일을 준비하고 있습니다.');progressTimer=setInterval(()=>pollProgress(progressToken),750);try{const result=await post('/api/dita-validation/run',{inputPath,mapPath:mapSelect.value,schematronType:selectedType.value,scope:document.getElementById('scopeSelect').value,selectedNodeIds:selected,validateMap:document.getElementById('validateMap').checked,progressToken});reportUrl=result.reportUrl;openReportBtn.hidden=false;show('success','검사 완료',result.validatedFileCount+'개 파일 검사, '+result.issueCount+'개 결과')}catch(e){show('error','검사 실패',e.message)}finally{if(progressTimer)clearInterval(progressTimer);button.disabled=!document.querySelector('input[name="schematronType"]:checked');button.textContent='검사 실행'}}
function show(type,title,message){const p=document.getElementById('resultPanel');p.hidden=false;p.dataset.status=type;document.getElementById('statusIndicator').classList.toggle('is-running',type==='running');document.getElementById('resultTitle').textContent=title;document.getElementById('resultMessage').textContent=message}
</script>
</body>
</html>
