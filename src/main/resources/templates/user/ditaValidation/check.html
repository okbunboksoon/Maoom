<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DITA Validation Check</title>
    <link rel="stylesheet" href="/user/css/RevisionPopup.css">
    <link rel="stylesheet" href="/user/css/DitaValidationCheck.css">
</head>
<body class="ber-popup-body">
<!-- 2단계: ditamap, 검사 범위, 통합 Schematron과 트리 항목을 선택하여 검사를 실행한다. -->
<main class="revision-page">
    <header class="revision-header">
        <div><h1>DITA Validation Check</h1><p id="inputPathLabel" class="path-value"></p></div>
    </header>
    <section class="revision-panel validation-panel">
        <div class="validation-grid">
            <label for="mapSelect">ditamap</label><select id="mapSelect"></select>
            <label for="scopeSelect">검사 범위</label>
            <select id="scopeSelect">
                <option value="ALL">ditamap 전체 검사 (항목 선택 불필요)</option>
                <option value="SELECTED_ONLY">선택한 항목만</option>
                <option value="SELECTED_WITH_DESCENDANTS">선택한 항목과 모든 자손</option>
            </select>
            <span>Schematron</span><div id="schematronOptions" class="schematron-options">불러오는 중...</div>
            <span>옵션</span><label><input id="validateMap" type="checkbox" checked> ditamap 자체 검사</label>
        </div>
        <div class="tree-section-header">
            <h3>ditamap 트리</h3>
            <div class="tree-controls"><button id="collapseAllBtn" type="button">전체 접기</button><button id="expandAllBtn" type="button">전체 펼치기</button></div>
        </div>
        <div id="treeBox" class="tree-box">불러오는 중...</div>
        <footer class="popup-actions"><button id="runBtn" class="action-button primary" type="button">검사 실행</button><button id="cancelBtn" class="action-button" type="button">취소</button></footer>
        <section id="resultPanel" class="result-panel" hidden>
            <div class="result-heading"><span id="statusIndicator" class="status-indicator"></span><strong id="resultTitle"></strong></div>
            <p id="resultMessage"></p>
            <div class="result-actions"><button id="openReportBtn" class="action-button primary" type="button" hidden>결과 보기</button></div>
        </section>
    </section>
</main>
<script src="/user/js/DitaValidationCheck.js"></script>
</body>
</html>
