<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DITA Validation Check</title>
    <link rel="stylesheet" href="/user/css/RevisionPopup.css">
</head>
<body class="ber-popup-body dita-validation-input-body">
<main class="revision-page revision-estimate-page">
    <header class="revision-header"><div>
        <h1>DITA Validation Check</h1>
        <p>입력 경로의 ditamap과 연결된 DITA 파일을 검사합니다.</p>
    </div></header>
    <section class="revision-panel" aria-label="입력 경로 선택">
        <div class="step-title"><span>1</span><div><strong>작업 선택</strong><small>GOMS 검사 경로를 입력하세요.</small></div></div>
        <div class="execution-mode-options" aria-label="실행 방식" th:hidden="${!executionModeVisible}">
            <label for="gomsMode"><input id="gomsMode" name="executionMode" type="radio" value="GOMS" checked><span>GOMS 실행</span></label>
            <label for="localPathMode"><input id="localPathMode" name="executionMode" type="radio" value="LOCAL_PATH"><span>로컬경로 실행</span></label>
        </div>
        <div class="path-row full-path-row">
            <label for="inputPath">입력경로</label>
            <div class="recent-path-field">
                <input id="inputPath" type="text" placeholder="경로를 입력하세요" autocomplete="off" aria-autocomplete="list" aria-controls="recentPathList" aria-expanded="false">
                <div id="recentPathList" class="recent-path-list" role="listbox" hidden></div>
            </div>
            <span></span><span></span>
        </div>
        <footer class="popup-actions">
            <button id="continueBtn" class="action-button primary" type="button">실행</button>
            <button class="action-button" type="button" onclick="window.close()">취소</button>
        </footer>
        <section id="resultPanel" class="result-panel" hidden><p id="resultMessage"></p></section>
        <div class="dita-report-entry" aria-label="리포트 확인">
            <div class="step-title"><span>2</span><div><strong>리포트 확인</strong><small>V 서버에 저장된 GOMS 검사 결과를 확인합니다.</small></div></div>
            <div class="dita-report-entry-action"><button id="reportListBtn" class="action-button" type="button">리포트 리스트 보기</button></div>
        </div>
    </section>
</main>
<script src="/user/js/DitaValidationInput.js"></script>
</body>
</html>
