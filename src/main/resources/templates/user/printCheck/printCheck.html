<!DOCTYPE html>
<!-- 인쇄데이터 검증: CLI EXE에 서버 기준 경로를 전달해 결과 xlsx를 생성한다. -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인쇄데이터 검증</title>
    <link rel="stylesheet" href="/user/css/RevisionPopup.css">
    <link rel="stylesheet" href="/user/css/PrintCheck.css">
</head>
<body class="print-check-popup-body">
<main class="revision-page revision-estimate-page">
    <header class="revision-header">
        <div>
            <h1>인쇄데이터 검증</h1>
            <p>대상 폴더를 검사하고 결과 엑셀을 생성합니다.</p>
        </div>
    </header>

    <section class="revision-panel" aria-label="인쇄데이터 검증 실행">
        <div class="step-title">
            <span>1</span>
            <div>
                <strong>검사 경로 입력</strong>
                <small>서버 PC에서 접근 가능한 대상 폴더를 입력하세요.</small>
            </div>
        </div>

        <div class="path-row print-check-path-row full-path-row">
            <label for="targetDirectory">대상 폴더 경로</label>
            <input id="targetDirectory" type="text"
                   placeholder="예: W:\2026\_Printing_KHQ"
                   autocomplete="off">
            <span></span>
            <span></span>
        </div>

        <div class="step-divider"></div>

        <div class="step-title">
            <span>2</span>
            <div>
                <strong>결과 저장 경로 입력</strong>
                <small>결과 파일은 입력한 폴더 아래에 날짜_인쇄데이터_검증.xlsx로 저장됩니다.</small>
            </div>
        </div>

        <div class="path-row print-check-path-row full-path-row">
            <label for="outputDirectory">결과 저장 경로</label>
            <input id="outputDirectory" type="text"
                   placeholder="예: V:\Tools\test\result"
                   autocomplete="off">
            <span></span>
            <span></span>
        </div>

        <footer class="popup-actions">
            <button id="runButton" class="action-button primary" type="button">
                실행
            </button>
            <button class="action-button" type="button" onclick="window.close()">
                취소
            </button>
        </footer>

        <section id="resultPanel" class="result-panel" hidden aria-live="polite">
            <div class="result-heading">
                <span id="statusIndicator" class="status-indicator"></span>
                <strong id="resultTitle">검증 준비 중</strong>
            </div>
            <p id="resultMessage"></p>
        </section>
    </section>
</main>

<script>
/*
 * 인쇄데이터 검증 팝업 동작 흐름.
 *
 * 1. 사용자가 서버 기준 대상 폴더와 결과 저장 경로를 입력한다.
 * 2. POST /api/pdf-check-scan-viewer/run 으로 JSON 요청을 보낸다.
 * 3. PdfCheckScanViewerService가 설정된 매치테이블로 CLI EXE를 실행하고 결과 xlsx 경로를 돌려준다.
 */
const targetDirectory = document.getElementById('targetDirectory');
const outputDirectory = document.getElementById('outputDirectory');
const runButton = document.getElementById('runButton');
const resultPanel = document.getElementById('resultPanel');
const statusIndicator = document.getElementById('statusIndicator');
const resultTitle = document.getElementById('resultTitle');
const resultMessage = document.getElementById('resultMessage');
const formInputs = [
    targetDirectory,
    outputDirectory
];
let progressCompleted = false;

runButton.addEventListener('click', runPrintCheck);
formInputs.forEach(input => {
    input.addEventListener('keydown', event => {
        if(event.key === 'Enter'){
            runPrintCheck();
        }
    });
});

async function runPrintCheck(){
    const request = {
        targetDirectory:targetDirectory.value.trim(),
        outputDirectory:outputDirectory.value.trim()
    };

    const missingInput = findMissingInput(request);
    if(missingInput){
        showResult('error', '입력 확인 필요', missingInput.message);
        missingInput.element.focus();
        return;
    }

    setFormDisabled(true);
    runButton.textContent = '검증 중...';
    progressCompleted = false;
    showResult('running', '인쇄데이터 검증 중', '프로그램을 실행했습니다. 대상 폴더 크기에 따라 시간이 걸릴 수 있습니다.');

    try{
        const response = await fetch('/api/pdf-check-scan-viewer/run', {
            method:'POST',
            headers:{
                'Content-Type':'application/json'
            },
            body:JSON.stringify(request)
        });

        if(!response.ok){
            throw new Error(await response.text() || '인쇄데이터 검증에 실패했습니다.');
        }

        const result = await response.json();
        progressCompleted = true;
        showResult(
            'success',
            '인쇄데이터 검증 완료',
            formatCompletedMessage(result));
    }catch(error){
        showResult(
            'error',
            '인쇄데이터 검증 실패',
            friendlyFetchError(error, '인쇄데이터 검증에 실패했습니다.'));
    }finally{
        setFormDisabled(false);
        runButton.textContent = '실행';
    }
}

function findMissingInput(request){
    if(!request.targetDirectory){
        return {
            element:targetDirectory,
            message:'대상 폴더 경로를 입력해 주세요.'
        };
    }
    if(!request.outputDirectory){
        return {
            element:outputDirectory,
            message:'결과 저장 경로를 입력해 주세요.'
        };
    }
    return null;
}

function setFormDisabled(disabled){
    formInputs.forEach(input => {
        input.disabled = disabled;
    });
    runButton.disabled = disabled;
}

function showResult(type, title, message){
    resultPanel.hidden = false;
    resultPanel.dataset.status = type;
    statusIndicator.classList.toggle('is-running', type === 'running');
    resultTitle.textContent = title;
    resultMessage.textContent = message || '';
    resizePrintCheckPopupForResult();
}

function formatCompletedMessage(result){
    const lines = [];
    if(result.resultPath){
        lines.push(`결과 파일: ${result.resultPath}`);
    }else if(result.message){
        lines.push(result.message);
    }else{
        lines.push('결과 xlsx 파일을 생성했습니다.');
    }

    if(result.log){
        lines.push('');
        lines.push('요약 로그:');
        lines.push(result.log);
    }

    return lines.join('\n');
}

function resizePrintCheckPopupForResult(){
    try{
        const contentHeight = document.documentElement.scrollHeight;
        const chromeHeight = window.outerHeight - window.innerHeight;
        const targetHeight = Math.min(
            screen.availHeight,
            Math.max(560, contentHeight + chromeHeight + 28));
        window.resizeTo(720, targetHeight);
    }catch(error){
        // 브라우저가 팝업 크기 변경을 막으면 현재 창 크기를 그대로 사용한다.
    }
}

function friendlyFetchError(error, fallbackMessage){
    if(error instanceof TypeError
            || error.message === 'Failed to fetch'){
        return '서버와 연결이 끊겼습니다. 서버가 실행 중인지 확인한 뒤 다시 시도해 주세요.';
    }

    return error.message || fallbackMessage;
}
</script>
</body>
</html>
