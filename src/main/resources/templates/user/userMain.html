<!DOCTYPE html>
<!--
    유저 메인 런처 화면.

    화면 위치:
    - GET /main
    - UserController.main()
    - templates/user/userMain.html

    화면 역할:
    - 로그인 후 사용자가 작업 기능을 선택하는 첫 화면이다.
    - launcherMenus 배열이 실제 기능 카드 목록이다.
    - 각 카드의 action 함수가 팝업 URL을 열고, 해당 URL은 UserController 또는
      기능별 Controller가 템플릿/API로 이어받는다.

    계정 기능:
    - 사용자 이름/비밀번호 수정: POST /api/user/account -> UserController.updateAccount() -> UserService
    - 프로필 이미지 조회/업로드/삭제: /api/user/profile-image -> UserProfileImageService

    수정 시 주의:
    - 새 기능 카드를 추가할 때는 launcherMenus에 항목을 추가하고, 아래 open...Popup()
      함수와 UserController의 화면 라우팅, 실제 실행 API Controller를 함께 확인한다.
    - 팝업 URL을 바꾸면 브라우저에서 열리는 화면뿐 아니라 테스트와 사용자 안내 문구도 같이 맞춘다.
-->

let activeMenuCategory = '전체';

function normalizeIconClass(icon){
    const normalized = icon
        .replace(/\bfa-solid\b/g, 'fas')
        .replace(/\bfa-regular\b/g, 'far')
        .trim();

    return /\bfa[rsb]\b/.test(normalized)
        ? normalized
        : 'fas ' + normalized;
}

// 캐시 무효화용 버전을 붙여 같은 파일 URL이라도 변경 직후 새 이미지를 요청한다.
function profileImageUrl(version){
    return '/api/user/profile-image?userId='
        + encodeURIComponent(accountUserId)
        + (version ? '&v=' + version : '');
}

// 메뉴 아바타와 대화상자 미리보기를 같은 최신 프로필 이미지로 갱신한다.
function refreshProfileImages(){
    const url = profileImageUrl(Date.now());

    [
        document.getElementById('accountMenuAvatarImage'),
        document.getElementById('accountProfilePreview')
    ].forEach(image => {
        image.hidden = false;
        image.src = url;
    });
}

// 프로필이 삭제되거나 조회되지 않으면 img를 숨기고 기본 사용자 아이콘을 보인다.
function hideProfileImages(){
    document.getElementById(
        'accountMenuAvatarImage'
    ).hidden = true;
    document.getElementById(
        'accountProfilePreview'
    ).hidden = true;
}

// JSON 또는 일반 문자열 형태의 서버 오류를 사용자에게 보여줄 한 문장으로 바꾼다.
function readErrorMessage(response, fallback){
    return response.text().then(text => {
        if(response.ok){
            return text ? JSON.parse(text) : {};
        }

        try{
            const body = JSON.parse(text);
            throw new Error(
                body.message || body.error || fallback
            );
        }catch(error){
            if(error instanceof SyntaxError){
                throw new Error(text || fallback);
            }
            throw error;
        }
    });
}

function openAccountDialog(){
    accountBackdrop.hidden = false;
    document.body.classList.add('dialog-open');
    document.getElementById('accountUserName').focus();
}

function closeAccountDialog(){
    accountBackdrop.hidden = true;
    document.body.classList.remove('dialog-open');
    document.getElementById('accountCurrentPassword').value = '';
    document.getElementById('accountNewPassword').value = '';
    document.getElementById('accountConfirmPassword').value = '';
    document.getElementById('accountFormError').textContent = '';
    updatePasswordMatchMessage();
}

function updatePasswordMatchMessage(){
    const newPasswordInput =
        document.getElementById('accountNewPassword');
    const confirmPasswordInput =
        document.getElementById('accountConfirmPassword');
    const messageElement =
        document.getElementById('accountPasswordMatchMessage');
    const saveButton =
        document.getElementById('accountSaveButton');
    const newPassword = newPasswordInput.value;
    const confirmPassword = confirmPasswordInput.value;
    const mismatched =
        (newPassword || confirmPassword)
        && newPassword !== confirmPassword;

    messageElement.textContent = mismatched
        ? '신규 비밀번호와 확인 비밀번호가 일치하지 않습니다.'
        : '';
    confirmPasswordInput.classList.toggle(
        'is-invalid',
        mismatched);
    saveButton.disabled = mismatched;

    return !mismatched;
}

document.getElementById('accountNewPassword')
    .addEventListener('input', updatePasswordMatchMessage);
document.getElementById('accountConfirmPassword')
    .addEventListener('input', updatePasswordMatchMessage);

accountBackdrop.addEventListener('click', function(event){
    if(event.target === accountBackdrop){
        closeAccountDialog();
    }
});

// 선택한 이미지를 multipart/form-data로 UserController 업로드 API에 전송한다.
accountProfileFile.addEventListener('change', function(){
    const file = accountProfileFile.files[0];

    if(!file){
        return;
    }

    const errorElement =
        document.getElementById('accountFormError');
    const formData = new FormData();
    formData.append('file', file);
    errorElement.textContent = '';

    fetch('/api/user/profile-image', {
        method:'POST',
        body:formData
    })
    .then(response => readErrorMessage(
        response,
        '프로필 이미지 변경에 실패했습니다.'
    ))
    .then(() => {
        refreshProfileImages();
    })
    .catch(error => {
        errorElement.textContent = error.message;
    })
    .finally(() => {
        accountProfileFile.value = '';
    });
});

document.getElementById(
    'accountImageDeleteButton'
).addEventListener('click', function(){
    const errorElement =
        document.getElementById('accountFormError');
    errorElement.textContent = '';

    fetch('/api/user/profile-image', {
        method:'DELETE'
    })
    .then(response => readErrorMessage(
        response,
        '프로필 이미지 삭제에 실패했습니다.'
    ))
    .then(() => {
        hideProfileImages();
    })
    .catch(error => {
        errorElement.textContent = error.message;
    });
});

function isAdministrator(){
    return document.querySelector('.admin-page-btn') !== null;
}

function renderLauncherMenus(){
    const grid =
        document.getElementById('menuGrid');
    const empty =
        document.getElementById('menuEmpty');
    const keyword =
        document.getElementById('menuSearch')
        .value
        .trim()
        .toLowerCase();
    const administrator =
        isAdministrator();

    grid.innerHTML = '';

    /*
     * 카드 표시 조건.
     * - adminOnly가 true인 기능은 관리자에게만 보인다.
     * - activeMenuCategory는 현재 탭 필터다. 지금 탭 버튼은 주석 처리되어 있지만,
     *   다시 살리면 이 조건이 그대로 사용된다.
     * - 검색어는 제목, 설명, 카테고리 문자열 전체에서 찾는다.
     */
    const visibleMenus = launcherMenus.filter(menu => {
        if(menu.adminOnly && !administrator){
            return false;
        }

        const categories = menu.category
            .split(',')
            .map(item => item.trim());

        if(activeMenuCategory !== '전체'
                && !categories.includes(activeMenuCategory)){
            return false;
        }

        if(!keyword){
            return true;
        }

        return menu.title.toLowerCase().includes(keyword)
            || menu.description.toLowerCase().includes(keyword)
            || menu.category.toLowerCase().includes(keyword);
    });

    visibleMenus.forEach(menu => {
        const button = document.createElement('button');
        button.className = 'launcher-card';
        button.type = 'button';
        button.addEventListener('click', menu.action);

        const icon = document.createElement('span');
        icon.className = 'launcher-card-icon';
        const iconElement = document.createElement('i');
        iconElement.className = normalizeIconClass(menu.icon);
        icon.appendChild(iconElement);

        const content = document.createElement('span');
        content.className = 'launcher-card-content';

        const title = document.createElement('strong');
        title.textContent = menu.title;

        const description = document.createElement('small');
        description.textContent = menu.description;

        const category = document.createElement('span');
        category.className = 'launcher-card-categories';

        menu.category
            .split(',')
            .map(item => item.trim())
            .filter(item => item)
            .forEach(item => {
                const badge = document.createElement('span');
                badge.className = 'launcher-card-category';
                badge.textContent = item;
                category.appendChild(badge);
            });

        content.appendChild(icon);
        content.appendChild(title);
        content.appendChild(description);
        button.appendChild(content);
        button.appendChild(category);
        grid.appendChild(button);
    });

    if(window.FontAwesome && window.FontAwesome.dom){
        window.FontAwesome.dom.i2svg({
            node: grid
        });
    }

    empty.hidden = visibleMenus.length > 0;
}

/*
 * 이름과 선택적 비밀번호 변경값을 UserAccountUpdateDto JSON으로 전송한다.
 * 신규 비밀번호가 공백이면 UserService가 기존 비밀번호를 그대로 유지한다.
 */
accountForm.addEventListener('submit', function(event){
    event.preventDefault();

    const saveButton =
        document.getElementById('accountSaveButton');
    const errorElement =
        document.getElementById('accountFormError');
    const userName =
        document.getElementById('accountUserName').value.trim();
    const currentPassword =
        document.getElementById('accountCurrentPassword').value;
    const newPassword =
        document.getElementById('accountNewPassword').value;
    const confirmPassword =
        document.getElementById('accountConfirmPassword').value;

    errorElement.textContent = '';

    if(!updatePasswordMatchMessage()){
        errorElement.textContent =
            '신규 비밀번호와 확인 비밀번호가 일치하지 않습니다.';
        return;
    }

    if(newPassword && !currentPassword){
        errorElement.textContent =
            '현재 비밀번호를 입력해주세요.';
        return;
    }

    saveButton.disabled = true;
    saveButton.textContent = '수정 중...';

    fetch('/api/user/account', {
        method:'POST',
        headers:{
            'Content-Type':'application/json'
        },
        body:JSON.stringify({
            userName:userName,
            currentPassword:currentPassword,
            newPassword:newPassword,
            confirmPassword:confirmPassword
        })
    })
    .then(async response => {
        const text = await response.text();

        if(!response.ok){
            try{
                const body = JSON.parse(text);
                throw new Error(
                    body.message
                    || body.error
                    || text
                    || '계정 정보를 수정하지 못했습니다.'
                );
            }catch(error){
                if(error instanceof SyntaxError){
                    throw new Error(
                        text || '계정 정보를 수정하지 못했습니다.'
                    );
                }
                throw error;
            }
        }

        return text ? JSON.parse(text) : {};
    })
    .then(user => {
        document.getElementById(
            'currentUserName'
        ).textContent = user.userName;
        document.getElementById(
            'accountUserName'
        ).value = user.userName;
        closeAccountDialog();
    })
    .catch(error => {
        errorElement.textContent = error.message;
    })
    .finally(() => {
        saveButton.disabled = false;
        saveButton.textContent = '수정';
    });
});
