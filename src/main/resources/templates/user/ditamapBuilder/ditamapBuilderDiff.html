<!DOCTYPE html>
<!-- 1안 테스트용: 법규 마스터와 실제 매뉴얼 DITAMAP을 비교한 뒤 V 체크 항목을 편집 화면으로 넘긴다. -->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>법규 Ditamap Builder</title>
    <link rel="stylesheet" href="/user/css/DitamapBuilder.css?v=diff-test-5">
</head>
<body class="ditamap-view-body">
<main class="ditamap-view-wrap">
    <header class="ditamap-header">
        <div>
            <h1>법규 Ditamap Builder</h1>
            <p id="diffPathText">DITA 경로 확인 중</p>
        </div>
    </header>

    <div class="ditamap-test-summary">
        <span id="diffModeChip" class="diff-chip diff-chip-match">비교 방식 확인 중</span>
        <span class="diff-chip diff-chip-branch">청록: legal-select-branch 전체 교체</span>
        <span class="diff-chip diff-chip-otherprops">주황: otherprops 개별 교체</span>
        <span class="diff-chip diff-chip-match">초록: 파일명 일치</span>
        <span class="diff-chip diff-chip-moved">노랑: 다른 위치에 있음</span>
        <span class="diff-chip diff-chip-master-unlinked">보라: 파일 있음 / DITAMAP 미연결</span>
        <span class="diff-chip diff-chip-master">빨강: 법규 마스터에만 있음</span>
        <span class="diff-chip diff-chip-manual">회색: 실제 매뉴얼에만 있음</span>
    </div>

    <div class="ditamap-tree-area diff-tree-area">
        <section class="ditamap-tree-panel"
                 aria-label="법규 마스터 DITAMAP">
            <header class="ditamap-tree-header">
                <div>
                    <h2>법규 마스터</h2>
                    <p>revision-tool 법규 템플릿 기준</p>
                </div>
            </header>
            <div class="ditamap-tree-columns law-ditamap-columns">
                <span>Title</span>
                <span>파일명</span>
            </div>
            <div id="masterTree"
                 class="ditamap-tree law-ditamap-tree"></div>
        </section>

        <section class="ditamap-tree-panel"
                 aria-label="실제 매뉴얼 DITAMAP">
            <header class="ditamap-tree-header">
                <div>
                    <h2>실제 매뉴얼</h2>
                    <p id="manualDitamapName">DITAMAP 대기 중</p>
                </div>
            </header>
            <div class="ditamap-tree-columns base-ditamap-columns">
                <span>V</span>
                <span>Title</span>
                <span>파일명</span>
            </div>
            <div id="manualTree"
                 class="ditamap-tree base-ditamap-tree"></div>
        </section>
    </div>

    <footer class="ditamap-view-actions">
        <button id="diffNextButton"
                class="ditamap-btn primary-btn"
                type="button"
                disabled>Next</button>
    </footer>
</main>

<div id="diffProgressBackdrop"
     class="legal-progress-backdrop"
     hidden>
    <div class="legal-progress-dialog"
         role="status"
         aria-live="polite">
        <div id="diffProgressHourglass"
             class="legal-progress-hourglass"
             aria-hidden="true">⌛</div>
        <strong id="diffProgressTitle">DITAMAP 비교 중</strong>
        <p id="diffProgressText">잠시만 기다려 주세요.</p>
        <div id="diffProgressDetails"
             class="legal-progress-details"
             hidden></div>
        <div class="legal-progress-actions">
            <button id="diffProgressReportButton"
                    class="ditamap-btn"
                    type="button"
                    hidden>상세 보기</button>
            <button id="diffProgressCloseButton"
                    class="ditamap-btn primary-btn"
                    type="button"
                    hidden>확인</button>
        </div>
    </div>
</div>

<script>
const diffParams = new URLSearchParams(location.search);
const compareMode = diffParams.get('mode') === 'otherprops'
        ? 'otherprops'
        : 'file';
const masterPath = diffParams.get('masterPath') || '';
const masterFileName = diffParams.get('masterFileName') || '';
const diffNextButton = document.getElementById('diffNextButton');
const diffPathText = document.getElementById('diffPathText');
const diffModeChip = document.getElementById('diffModeChip');
const masterTree = document.getElementById('masterTree');
const manualTree = document.getElementById('manualTree');
const manualDitamapName = document.getElementById('manualDitamapName');
const diffProgressBackdrop = document.getElementById('diffProgressBackdrop');
const diffProgressHourglass = document.getElementById('diffProgressHourglass');
const diffProgressTitle = document.getElementById('diffProgressTitle');
const diffProgressText = document.getElementById('diffProgressText');
const diffProgressDetails = document.getElementById('diffProgressDetails');
const diffProgressReportButton = document.getElementById('diffProgressReportButton');
const diffProgressCloseButton = document.getElementById('diffProgressCloseButton');
const masterPanel = masterTree.closest('.ditamap-tree-panel');
const manualPanel = manualTree.closest('.ditamap-tree-panel');
let diffManualTree = null;
let diffManualRows = [];
let diffCrossCheck = null;
let diffOtherpropsReportId = '';
let isSyncingDiffScroll = false;

function showDiffProgress(title, text, state, details){
    diffProgressTitle.textContent = title;
    diffProgressText.textContent = text || '';
    diffProgressDetails.innerHTML = '';
    diffProgressDetails.hidden = !details;
    diffProgressReportButton.hidden =
            state !== 'complete'
            || !details
            || details.dataset.showReport !== 'true';

    if(details){
        diffProgressDetails.appendChild(details);
    }

    diffProgressBackdrop.hidden = false;
    diffProgressBackdrop.classList.toggle('is-complete', state === 'complete');
    diffProgressBackdrop.classList.toggle('is-error', state === 'error');
    diffProgressBackdrop.classList.toggle('has-details', Boolean(details));
    diffProgressHourglass.hidden = state !== 'progress';
    diffProgressCloseButton.hidden = state === 'progress';
}

function hideDiffProgress(){
    diffProgressBackdrop.hidden = true;
    diffProgressBackdrop.classList.remove('is-complete', 'is-error', 'has-details');
    diffProgressDetails.innerHTML = '';
    diffProgressDetails.hidden = true;
    diffProgressReportButton.hidden = true;
}

function flattenNodes(nodes, rows){
    const result = rows || [];

    (nodes || []).forEach(node => {
        result.push(Object.assign({}, node, {
            children:null
        }));

        if(node.children && node.children.length > 0){
            flattenNodes(node.children, result);
        }
    });

    return result;
}

function normalizeKey(row){
    const fileName = (row.fileName || '').trim().toLowerCase();

    if(fileName){
        return 'file:' + fileName;
    }

    return 'title:' + (row.title || '').trim().toLowerCase();
}

function normalizeFileKey(row){
    const fileName = (row && row.fileName || '').trim().toLowerCase();

    return fileName ? 'file:' + fileName : '';
}

function pushMapValue(map, key, value){
    if(!map.has(key)){
        map.set(key, []);
    }

    map.get(key).push(value);
}

function popMapValue(map, key){
    const values = map.get(key) || [];

    if(values.length === 0){
        return null;
    }

    return values.shift();
}

function renderDiffRow(rowData, target, options){
    const row = document.createElement('div');
    const isManual = options.side === 'manual';
    const isBlank = !rowData;
    const safeRow = rowData || {
        title:'',
        level:options.level || 1,
        fileName:''
    };
    row.className = 'ditamap-tree-row';
    row.dataset.level = String(Math.max(safeRow.level || 1, 1));

    if(isBlank){
        row.classList.add('is-diff-blank');
    }

    if(options.status){
        row.classList.add('is-diff-' + options.status);
    }

    if(isManual){
        const checkCell = document.createElement('div');
        checkCell.className = 'ditamap-tree-check';
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'ditamap-topic-check';
        checkbox.checked = !isBlank
                && (compareMode === 'otherprops'
                    ? options.status === 'branch-candidate'
                        || options.status === 'branch-child'
                        || options.status === 'otherprops-candidate'
                    : options.status === 'match'
                        || options.status === 'moved');

        if(isBlank || options.index == null){
            checkbox.disabled = true;
        }else{
            checkbox.dataset.index = String(options.index);
            checkbox.dataset.diffStatus = options.status || '';
            checkbox.dataset.matchType = options.matchType || '';
            checkbox.dataset.branchKey = options.branchKey || '';
            checkbox.dataset.otherpropsKey = options.otherpropsKey || '';
            checkbox.dataset.matchedMasterIndex = options.matchedMasterIndex == null
                    ? ''
                    : String(options.matchedMasterIndex);
            checkbox.dataset.manualRootIndex = options.manualRootIndex == null
                    ? ''
                    : String(options.manualRootIndex);
            checkbox.addEventListener('change', updateDiffNextButton);
        }

        checkCell.appendChild(checkbox);
        row.appendChild(checkCell);
    }

    const titleCell = document.createElement('div');
    titleCell.className = 'ditamap-tree-title';
    titleCell.style.paddingLeft = ((Math.max(safeRow.level || 1, 1) - 1) * 24) + 'px';
    const marker = document.createElement('span');
    marker.className = 'tree-marker';
    marker.textContent = isBlank ? '' : '-';
    const levelBadge = document.createElement('span');
    levelBadge.className = 'level-badge';
    levelBadge.textContent = isBlank
        ? ''
        : 'L' + Math.max(safeRow.level || 1, 1);
    const title = document.createElement('span');
    title.className = 'tree-title-text';
    title.textContent = isBlank ? '' : (safeRow.title || '(제목 없음)');
    const fileName = document.createElement('div');
    fileName.className = 'ditamap-tree-file';
    fileName.textContent = safeRow.fileName || '';

    titleCell.appendChild(marker);
    if(!isBlank){
        titleCell.appendChild(levelBadge);
    }
    titleCell.appendChild(title);
    row.appendChild(titleCell);
    row.appendChild(fileName);
    target.appendChild(row);
}

function updateDiffNextButton(){
    diffNextButton.disabled =
            manualTree.querySelectorAll('.ditamap-topic-check:checked').length === 0;
}

function syncDiffPanelScroll(sourcePanel, targetPanel){
    if(isSyncingDiffScroll || !sourcePanel || !targetPanel){
        return;
    }

    isSyncingDiffScroll = true;
    targetPanel.scrollTop = sourcePanel.scrollTop;
    targetPanel.scrollLeft = sourcePanel.scrollLeft;
    requestAnimationFrame(() => {
        isSyncingDiffScroll = false;
    });
}

function scrollBothDiffPanels(deltaY){
    if(!masterTree || !manualTree){
        return;
    }

    isSyncingDiffScroll = true;
    masterTree.scrollTop += deltaY;
    manualTree.scrollTop += deltaY;
    requestAnimationFrame(() => {
        isSyncingDiffScroll = false;
    });
}

function buildDiffMatches(masterRows, manualRows){
    const masterKeys = masterRows.map(normalizeKey);
    const manualKeys = manualRows.map(normalizeKey);
    const rowCount = masterRows.length + 1;
    const colCount = manualRows.length + 1;
    const lengths = Array.from({length:rowCount}, () => Array(colCount).fill(0));

    for(let masterIndex = masterRows.length - 1; masterIndex >= 0; masterIndex--){
        for(let manualIndex = manualRows.length - 1; manualIndex >= 0; manualIndex--){
            if(masterKeys[masterIndex] === manualKeys[manualIndex]){
                lengths[masterIndex][manualIndex] = lengths[masterIndex + 1][manualIndex + 1] + 1;
            }else{
                lengths[masterIndex][manualIndex] = Math.max(
                        lengths[masterIndex + 1][manualIndex],
                        lengths[masterIndex][manualIndex + 1]);
            }
        }
    }

    const matches = [];
    let masterIndex = 0;
    let manualIndex = 0;

    while(masterIndex < masterRows.length && manualIndex < manualRows.length){
        if(masterKeys[masterIndex] === manualKeys[manualIndex]){
            matches.push({
                masterIndex:masterIndex,
                manualIndex:manualIndex
            });
            masterIndex++;
            manualIndex++;
        }else if(lengths[masterIndex + 1][manualIndex] >= lengths[masterIndex][manualIndex + 1]){
            masterIndex++;
        }else{
            manualIndex++;
        }
    }

    return matches;
}

function getMasterOnlyStatus(masterRow, manualFileKeys, manualDiskFileKeys){
    const key = normalizeFileKey(masterRow);

    if(manualFileKeys.has(key)){
        return 'moved';
    }

    if(manualDiskFileKeys.has(key)){
        return 'master-unlinked';
    }

    return 'master-only';
}

function createOtherpropsMatchState(crossCheck){
    const manualStatusByIndex = new Map();
    const masterStatusByIndex = new Map();
    const replacedMasterIndexes = new Set();
    const masterRows = Array.isArray(crossCheck.masterRows)
            ? crossCheck.masterRows
            : [];
    const masterRowsByIndex = new Map(masterRows.map(row => [Number(row.index), row]));

    function collectSubtreeIndexes(rows, rootIndex){
        const rootRow = masterRowsByIndex.get(Number(rootIndex));

        if(!rootRow){
            return [Number(rootIndex)];
        }

        const rootPosition = rows.findIndex(row => Number(row.index) === Number(rootIndex));

        if(rootPosition < 0){
            return [Number(rootIndex)];
        }

        const rootLevel = Number(rootRow.level || 0);
        const indexes = [];

        for(let offset = rootPosition; offset < rows.length; offset++){
            const row = rows[offset];

            if(offset > rootPosition && Number(row.level || 0) <= rootLevel){
                break;
            }

            indexes.push(Number(row.index));
        }

        return indexes;
    }

    (crossCheck.branchMatches || []).forEach(match => {
        const masterIndex = Number(match.masterIndex);
        collectSubtreeIndexes(masterRows, masterIndex).forEach((index, offset) => {
            replacedMasterIndexes.add(index);
            masterStatusByIndex.set(index, {
                status:offset === 0 ? 'branch-candidate' : 'branch-child'
            });
        });
        (match.manualIndexes || []).forEach((manualIndex, offset) => {
            manualStatusByIndex.set(Number(manualIndex), {
                status:offset === 0 ? 'branch-candidate' : 'branch-child',
                matchType:offset === 0 ? 'branch' : 'branch-child',
                branchKey:match.branchKey || '',
                matchedMasterIndex:match.masterIndex,
                manualRootIndex:match.manualIndex
            });
        });
    });

    (crossCheck.topicMatches || []).forEach(match => {
        const masterIndex = Number(match.masterIndex);
        const manualIndex = Number(match.manualIndex);
        replacedMasterIndexes.add(masterIndex);

        if(manualStatusByIndex.has(manualIndex)){
            return;
        }

        masterStatusByIndex.set(masterIndex, {
            status:'otherprops-candidate'
        });
        manualStatusByIndex.set(manualIndex, {
            status:'otherprops-candidate',
            matchType:'topic',
            otherpropsKey:match.otherpropsKey || '',
            matchedMasterIndex:match.masterIndex
        });
    });

    return {
        manualStatusByIndex:manualStatusByIndex,
        masterStatusByIndex:masterStatusByIndex,
        replacedMasterIndexes:replacedMasterIndexes
    };
}

function emptyOtherpropsMatchState(){
    return {
        manualStatusByIndex:new Map(),
        masterStatusByIndex:new Map(),
        replacedMasterIndexes:new Set()
    };
}

function splitOtherpropsTokens(value){
    return String(value || '')
            .trim()
            .split(/\s+/)
            .filter(Boolean);
}

function findOtherpropsCandidates(masterRow, manualRows){
    const tokens = splitOtherpropsTokens(masterRow && masterRow.otherprops);
    const candidates = [];

    if(tokens.length === 0){
        return candidates;
    }

    manualRows.forEach(row => {
        const manualTokens = new Set(splitOtherpropsTokens(row.otherprops));

        if(tokens.some(token => manualTokens.has(token))){
            candidates.push(row);
        }
    });

    return candidates;
}

function appendIssueList(parent, title, rows, renderDetail){
    const section = document.createElement('section');
    const heading = document.createElement('strong');
    const list = document.createElement('ul');

    section.className = 'legal-progress-issue-section';
    heading.textContent = title;
    list.className = 'legal-progress-issue-list';

    rows.forEach(row => {
        const item = document.createElement('li');
        item.textContent = renderDetail(row);
        list.appendChild(item);
    });

    section.appendChild(heading);
    section.appendChild(list);
    parent.appendChild(section);
}

function toReportRow(row){
    return {
        level:Number(row.level || 0),
        fileName:row.fileName || '',
        title:row.title || '',
        otherprops:row.otherprops || ''
    };
}

function buildOtherpropsReportData(crossCheck){
    if(compareMode !== 'otherprops'
            || !crossCheck
            || !Array.isArray(crossCheck.masterRows)
            || !Array.isArray(crossCheck.manualRows)){
        return null;
    }

    const masterRows = crossCheck.masterRows;
    const manualRows = crossCheck.manualRows;
    const levelThreeRows = masterRows.filter(row => Number(row.level || 0) >= 3);
    const targetRows = levelThreeRows.filter(row =>
            splitOtherpropsTokens(row.otherprops).length > 0);
    const branchRows = targetRows.filter(row => row.legalSelectBranch);
    const topicRows = targetRows.filter(row => !row.legalSelectBranch);
    const branchMatches = new Set((crossCheck.branchMatches || [])
            .map(match => Number(match.masterIndex)));
    const topicMatches = new Set((crossCheck.topicMatches || [])
            .map(match => Number(match.masterIndex)));
    const branchFailed = branchRows
            .filter(row => !branchMatches.has(Number(row.index)))
            .map(row => Object.assign({}, row, {
                candidates:findOtherpropsCandidates(row, manualRows)
            }));
    const topicUnmatched = topicRows
            .filter(row => !topicMatches.has(Number(row.index)))
            .map(row => Object.assign({}, row, {
                candidates:findOtherpropsCandidates(row, manualRows)
            }));
    const topicMissing = topicUnmatched
            .filter(row => row.candidates.length === 0);
    const topicMultiple = topicUnmatched
            .filter(row => row.candidates.length > 1);
    const branchSuccessCount = (crossCheck.branchMatches || [])
            .filter(match => {
                const row = masterRows[Number(match.masterIndex)];
                return row && Number(row.level || 0) >= 3;
            }).length;
    const topicSuccessCount = (crossCheck.topicMatches || [])
            .filter(match => {
                const row = masterRows[Number(match.masterIndex)];
                return row && Number(row.level || 0) >= 3;
            }).length;

    return {
        path:diffParams.get('path') || '',
        masterPath:masterPath,
        masterFileName:masterFileName,
        summary:{
            targetCount:targetRows.length,
            successCount:branchSuccessCount + topicSuccessCount,
            failureCount:branchFailed.length + topicMissing.length,
            pendingCount:topicMultiple.length,
            branchSuccessCount:branchSuccessCount,
            topicSuccessCount:topicSuccessCount,
            branchFailureCount:branchFailed.length,
            topicFailureCount:topicMissing.length
        },
        guide:[
            'branch는 해당 topic 하나만 교체하는 게 아니라 지정된 범위 전체를 교체 대상으로 보는 항목이고,',
            'topic은 매칭된 topic 하나만 개별 교체 대상으로 보는 항목입니다.'
        ],
        branchFailed:branchFailed.map(toReportRow),
        topicMissing:topicMissing.map(toReportRow),
        topicMultiple:topicMultiple.map(row => Object.assign(toReportRow(row), {
            candidates:row.candidates.map(toReportRow)
        }))
    };
}

function buildOtherpropsResultDetails(report){
    if(!report){
        return null;
    }

    const details = document.createElement('div');
    const summary = document.createElement('div');
    const guide = document.createElement('div');

    details.className = 'legal-progress-result-details';
    summary.className = 'legal-progress-result-summary';
    summary.textContent =
            'L3 이상 otherprops 대상 '
            + report.summary.targetCount
            + '개 · 성공 '
            + report.summary.successCount
            + '개 · 실패 '
            + report.summary.failureCount
            + '개 · 보류 '
            + report.summary.pendingCount
            + '개';
    details.appendChild(summary);
    guide.className = 'legal-progress-result-guide';
    report.guide.forEach(text => {
        const line = document.createElement('div');
        line.textContent = text;
        guide.appendChild(line);
    });
    details.appendChild(guide);

    const note = document.createElement('p');
    note.className = 'legal-progress-report-note';
    note.textContent = '실패/보류 전체 목록은 상세 보기 창에서 비교 화면을 보면서 확인할 수 있습니다.';
    details.appendChild(note);

    details.dataset.showReport =
            report.summary.failureCount > 0 || report.summary.pendingCount > 0
                    ? 'true'
                    : 'false';

    return details;
}

function saveOtherpropsReport(report){
    if(!report){
        diffOtherpropsReportId = '';
        return;
    }

    diffOtherpropsReportId =
            'otherprops-report-' + Date.now() + '-' + Math.random().toString(16).slice(2);
    localStorage.setItem(
            'ditamapOtherpropsReport:' + diffOtherpropsReportId,
            JSON.stringify(report));
}

function openOtherpropsReport(){
    if(!diffOtherpropsReportId){
        return;
    }

    window.open(
            '/ditamap-builder/otherprops-report?report='
                + encodeURIComponent(diffOtherpropsReportId),
            'ditamapOtherpropsReport',
            'width=980,height=820,menubar=no,toolbar=no,location=no,status=no,scrollbars=yes,resizable=yes');
}

diffProgressReportButton.addEventListener('click', openOtherpropsReport);

function buildLegacyOtherpropsResultDetails(report){
    const details = document.createElement('div');

    if(report.branchFailed.length > 0){
        appendIssueList(
                details,
                'branch 실패: 범위 전체 교체 대상 - 실제 otherprops 후보 없음',
                report.branchFailed,
                row => (row.otherprops || '-')
                        + ' | L'
                        + row.level
                        + ' '
                        + (row.fileName || '')
                        + ' | '
                        + (row.title || ''));
    }

    if(report.topicMissing.length > 0){
        appendIssueList(
                details,
                'topic 실패: 개별 topic 교체 대상 - 실제 otherprops 후보 없음',
                report.topicMissing,
                row => (row.otherprops || '-')
                        + ' | L'
                        + row.level
                        + ' '
                        + (row.fileName || '')
                        + ' | '
                        + (row.title || ''));
    }

    return details;
}

function mergeStatus(baseStatus, override){
    return Object.assign({}, override || {}, {
        status:override && override.status || baseStatus
    });
}

function renderDiff(master, manual, manualDiskFiles, crossCheck){
    const masterRows = crossCheck && crossCheck.masterRows
            ? crossCheck.masterRows
            : flattenNodes(master.nodes || []);
    const manualRows = crossCheck && crossCheck.manualRows
            ? crossCheck.manualRows
            : flattenNodes(manual.nodes || []);
    const matches = compareMode === 'file'
            ? buildDiffMatches(masterRows, manualRows)
            : [];
    const otherpropsState = compareMode === 'otherprops'
            ? createOtherpropsMatchState(crossCheck || {})
            : emptyOtherpropsMatchState();
    const masterFileKeys = new Set(masterRows
            .map(normalizeFileKey)
            .filter(Boolean));
    const manualFileKeys = new Set(manualRows
            .map(normalizeFileKey)
            .filter(Boolean));
    const manualDiskFileKeys = new Set((manualDiskFiles || [])
            .map(fileName => String(fileName || '').trim().toLowerCase())
            .map(fileName => fileName ? 'file:' + fileName : '')
            .filter(Boolean));
    masterTree.innerHTML = '';
    manualTree.innerHTML = '';
    document.querySelectorAll('.diff-chip-moved')
            .forEach(chip => chip.hidden = compareMode === 'otherprops');
    manualDitamapName.textContent = manual.rootTitle + ' · ' + manual.ditamapFile;
    diffModeChip.textContent = compareMode === 'otherprops'
            ? '비교 방식: otherprops 기준'
            : '비교 방식: 파일명 기준';
    diffManualRows = manualRows;

    /*
     * Beyond Compare HTML처럼 LCS(diff) 기준으로 순서를 보존한다.
     * 다음 공통 topicref 전까지 왼쪽-only 블록, 오른쪽-only 블록을 차례로 보여준다.
     */
    let masterCursor = 0;
    let manualCursor = 0;

    matches.forEach(match => {
        while(masterCursor < match.masterIndex){
            const masterRow = masterRows[masterCursor];
            const status = compareMode === 'otherprops'
                    ? 'master-only'
                    : getMasterOnlyStatus(
                            masterRow,
                            manualFileKeys,
                            manualDiskFileKeys);
            renderDiffRow(masterRow, masterTree, {
                side:'master',
                status:mergeStatus(
                        status,
                        otherpropsState.masterStatusByIndex.get(masterCursor)).status,
                level:masterRow.level || 1
            });
            renderDiffRow(null, manualTree, {
                side:'manual',
                index:null,
                status:status,
                level:masterRow.level || 1
            });
            masterCursor++;
        }

        while(manualCursor < match.manualIndex){
            const manualRow = manualRows[manualCursor];
            const status = compareMode === 'otherprops'
                    ? 'manual-only'
                    : masterFileKeys.has(normalizeFileKey(manualRow))
                            ? 'moved'
                            : 'manual-only';
            renderDiffRow(null, masterTree, {
                side:'master',
                status:status,
                level:manualRow.level || 1
            });
            renderDiffRow(manualRow, manualTree, {
                side:'manual',
                index:manualCursor,
                ...mergeStatus(
                        status,
                        otherpropsState.manualStatusByIndex.get(manualCursor)),
                level:manualRow.level || 1
            });
            manualCursor++;
        }

        const masterRow = masterRows[match.masterIndex];
        const manualRow = manualRows[match.manualIndex];
        const rowLevel = Math.max(masterRow.level || 1, manualRow.level || 1);
        const manualOverride =
                otherpropsState.manualStatusByIndex.get(match.manualIndex);
        const masterIsReplaced =
                otherpropsState.replacedMasterIndexes.has(match.masterIndex);
        const baseManualStatus = masterIsReplaced && !manualOverride
                ? 'manual-only'
                : 'match';
        renderDiffRow(masterRow, masterTree, {
            side:'master',
            status:mergeStatus(
                    'match',
                    otherpropsState.masterStatusByIndex.get(match.masterIndex)).status,
            level:rowLevel
        });
        renderDiffRow(manualRow, manualTree, {
            side:'manual',
            index:match.manualIndex,
            ...mergeStatus(
                    baseManualStatus,
                    manualOverride),
            level:rowLevel
        });

        masterCursor = match.masterIndex + 1;
        manualCursor = match.manualIndex + 1;
    });

    while(masterCursor < masterRows.length){
        const masterRow = masterRows[masterCursor];
        const status = compareMode === 'otherprops'
                ? 'master-only'
                : getMasterOnlyStatus(
                        masterRow,
                        manualFileKeys,
                        manualDiskFileKeys);
        renderDiffRow(masterRow, masterTree, {
            side:'master',
            status:mergeStatus(
                    status,
                    otherpropsState.masterStatusByIndex.get(masterCursor)).status,
            level:masterRow.level || 1
        });
        renderDiffRow(null, manualTree, {
            side:'manual',
            index:null,
            status:status,
            level:masterRow.level || 1
        });
        masterCursor++;
    }

    while(manualCursor < manualRows.length){
        const manualRow = manualRows[manualCursor];
        const status = compareMode === 'otherprops'
                ? 'manual-only'
                : masterFileKeys.has(normalizeFileKey(manualRow))
                        ? 'moved'
                        : 'manual-only';
        renderDiffRow(null, masterTree, {
            side:'master',
            status:status,
            level:manualRow.level || 1
        });
        renderDiffRow(manualRow, manualTree, {
            side:'manual',
            index:manualCursor,
            ...mergeStatus(
                    status,
                    otherpropsState.manualStatusByIndex.get(manualCursor)),
            level:manualRow.level || 1
        });
        manualCursor++;
    }

    diffManualTree = manual;
    updateDiffNextButton();
}

async function loadDiff(path){
    if(!path){
        return;
    }

    showDiffProgress('DITAMAP 비교 중', '법규 마스터와 실제 매뉴얼을 비교하고 있습니다.', 'progress');
    diffPathText.textContent = path + ' · '
            + (compareMode === 'otherprops'
                    ? 'otherprops 기준'
                    : '파일명 기준');
    const masterRequest = {
        masterPath:masterPath,
        masterFileName:masterFileName
    };
    const pathRequest = Object.assign({path:path}, masterRequest);

    try{
        const [masterResponse, manualResponse, manualFilesResponse, crossCheckResponse] = await Promise.all([
            fetch('/api/ditamap-builder/legal-master', {
                method:'POST',
                headers:{
                    'Content-Type':'application/json',
                    'Accept':'application/json'
                },
                body:JSON.stringify(masterRequest)
            }),
            fetch('/api/ditamap-builder/tree-summary', {
                method:'POST',
                headers:{
                    'Content-Type':'application/json',
                    'Accept':'application/json'
                },
                body:JSON.stringify({path:path})
            }),
            fetch('/api/ditamap-builder/dita-files', {
                method:'POST',
                headers:{
                    'Content-Type':'application/json',
                    'Accept':'application/json'
                },
                body:JSON.stringify({path:path})
            }),
            fetch('/api/ditamap-builder/cross-check', {
                method:'POST',
                headers:{
                    'Content-Type':'application/json',
                    'Accept':'application/json'
                },
                body:JSON.stringify(pathRequest)
            })
        ]);

        if(!masterResponse.ok){
            throw new Error(await masterResponse.text());
        }

        if(!manualResponse.ok){
            throw new Error(await manualResponse.text());
        }

        if(!manualFilesResponse.ok){
            throw new Error(await manualFilesResponse.text());
        }

        if(!crossCheckResponse.ok){
            throw new Error(await crossCheckResponse.text());
        }

        diffCrossCheck = await crossCheckResponse.json();
        renderDiff(
                await masterResponse.json(),
                await manualResponse.json(),
                await manualFilesResponse.json(),
                diffCrossCheck);
        const report = buildOtherpropsReportData(diffCrossCheck);
        saveOtherpropsReport(report);
        showDiffProgress(
                'DITAMAP 비교 완료',
                '비교 결과를 불러왔습니다.',
                'complete',
                buildOtherpropsResultDetails(report));
    }catch(error){
        showDiffProgress(
                'DITAMAP 비교 실패',
                error.message || '비교 결과를 불러오지 못했습니다.',
                'error');
    }
}

function openDiffEditor(){
    if(!diffManualTree){
        return;
    }

    const checkedTopics = Array.from(manualTree.querySelectorAll('.ditamap-topic-check:checked'))
            .map(checkbox => Object.assign(
                    {},
                    diffManualRows[Number(checkbox.dataset.index)],
                    {
                        diffStatus:checkbox.dataset.diffStatus || '',
                        matchType:checkbox.dataset.matchType || '',
                        branchKey:checkbox.dataset.branchKey || '',
                        otherpropsKey:checkbox.dataset.otherpropsKey || '',
                        matchedMasterIndex:checkbox.dataset.matchedMasterIndex || '',
                        manualRootIndex:checkbox.dataset.manualRootIndex || ''
                    }))
            .filter(Boolean);

    if(checkedTopics.length === 0){
        showDiffProgress('선택 항목 없음', '편집 화면으로 넘길 V 체크 항목이 없습니다.', 'error');
        return;
    }

    const draftId = 'legal-draft-diff-' + Date.now();
    localStorage.setItem('ditamapLegalDraft:' + draftId, JSON.stringify({
        ditamapFile:diffManualTree.ditamapFile,
        baseDitamapFile:diffManualTree.ditamapFile,
        compareMode:compareMode,
        masterPath:masterPath,
        masterFileName:masterFileName,
        crossCheck:diffCrossCheck,
        topics:checkedTopics
    }));
    window.open(
            '/ditamap-builder/legal-editor?draft=' + encodeURIComponent(draftId),
            'ditamapLegalEditorDiff',
            'width=1280,height=860,menubar=no,toolbar=no,location=no,status=no,scrollbars=yes,resizable=yes');
}

diffNextButton.addEventListener('click', openDiffEditor);
diffProgressCloseButton.addEventListener('click', hideDiffProgress);

[masterPanel, manualPanel].forEach(panel => {
    if(!panel){
        return;
    }

    panel.addEventListener('wheel', event => {
        event.preventDefault();
        scrollBothDiffPanels(event.deltaY);
    }, {passive:false});
});

masterTree.addEventListener('scroll', () => {
    syncDiffPanelScroll(masterTree, manualTree);
});
manualTree.addEventListener('scroll', () => {
    syncDiffPanelScroll(manualTree, masterTree);
});

const initialDiffPath = diffParams.get('path') || '';
loadDiff(initialDiffPath);
</script>
