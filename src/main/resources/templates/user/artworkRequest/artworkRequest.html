<!DOCTYPE html>
<!-- 도안의뢰서 작성: PDF 하나를 받아 도안의뢰서 생성 API로 전달한다. -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도안의뢰서 작성</title>
    <link rel="stylesheet" href="/user/css/RevisionPopup.css">
    <link rel="stylesheet" href="/user/css/ArtworkRequest.css">
</head>
<body class="artwork-request-popup-body">
<main class="revision-page revision-estimate-page">
    <header class="revision-header">
        <div>
            <h1>도안의뢰서 작성</h1>
            <p>PDF 파일을 선택한 뒤 도안의뢰서를 작성합니다.</p>
        </div>
    </header>

    <section class="revision-panel" aria-label="도안의뢰서 작성 실행">
        <div class="step-title">
            <span>1</span>
            <div>
                <strong>입력 경로 선택</strong>
                <small>결과 폴더를 만들 서버 PC 경로를 입력하세요.(V서버, H서버)</small>
            </div>
        </div>

        <div class="path-row artwork-path-row full-path-row">
            <label for="inputPath">입력경로</label>
            <input id="inputPath" type="text"
                   placeholder="경로를 입력하세요"
                   autocomplete="off">
            <span></span>
            <span></span>
        </div>

        <div class="step-divider"></div>

        <div class="step-title">
            <span>2</span>
            <div>
                <strong>PDF 파일 선택</strong>
                <small>도안의뢰서 작성에 사용할 PDF 파일을 아래 입력칸에 끌어다 놓으세요.</small>
            </div>
        </div>

        <div id="pdfDropRow" class="path-row artwork-file-row full-path-row">
            <label for="pdfPath">PDF 파일</label>
            <input id="pdfPath" type="text"
                   placeholder="PDF 파일을 여기에 끌어다 놓기"
                   readonly>
            <span></span>
            <span></span>
        </div>

        <footer class="popup-actions">
            <button id="runButton" class="action-button primary" type="button">
                실행
            </button>
            <button class="action-button" type="button" onclick="window.close()">
                취소
            </button>
        </footer>

        <section id="resultPanel" class="result-panel" hidden aria-live="polite">
            <div class="result-heading">
                <span id="statusIndicator" class="status-indicator"></span>
                <strong id="resultTitle">작성 준비 중</strong>
            </div>
            <p id="resultMessage"></p>
        </section>
    </section>
</main>

<script>
/*
 * 도안의뢰서 작성 팝업 동작 흐름.
 *
 * 1. 사용자가 결과 폴더를 만들 서버 기준 경로를 입력한다.
 * 2. PDF 파일 한 건을 입력 행에 드래그한다.
 * 3. POST /api/artwork-request/run 으로 경로와 PDF를 multipart/form-data로 보낸다.
 * 4. ArtworkRequestService가 PDFImageExtractor를 호출하고 생성된 엑셀 경로를 돌려준다.
 */
const pdfDropRow = document.getElementById('pdfDropRow');
const inputPath = document.getElementById('inputPath');
const pdfPathInput = document.getElementById('pdfPath');
const runButton = document.getElementById('runButton');
const resultPanel = document.getElementById('resultPanel');
const statusIndicator = document.getElementById('statusIndicator');
const resultTitle = document.getElementById('resultTitle');
const resultMessage = document.getElementById('resultMessage');
let selectedPdfFile = null;

['dragenter', 'dragover'].forEach(eventName => {
    pdfDropRow.addEventListener(eventName, event => {
        event.preventDefault();
        event.stopPropagation();
        pdfDropRow.classList.add('is-dragging');
        event.dataTransfer.dropEffect = 'copy';
    });
});

['dragleave', 'drop'].forEach(eventName => {
    pdfDropRow.addEventListener(eventName, event => {
        event.preventDefault();
        event.stopPropagation();
        pdfDropRow.classList.remove('is-dragging');
    });
});

pdfDropRow.addEventListener('drop', event => {
    // 여러 파일을 떨어뜨려도 이 기능은 첫 번째 PDF 한 건만 처리한다.
    const file = Array.from(event.dataTransfer.files)
        .find(item => /\.pdf$/i.test(item.name));

    if(!file){
        showResult('error', '파일 확인 필요', 'PDF 파일만 선택할 수 있습니다.');
        return;
    }

    setPdfFile(file);
});

runButton.addEventListener('click', runArtworkRequest);
inputPath.addEventListener('keydown', event => {
    if(event.key === 'Enter'){
        runArtworkRequest();
    }
});

function setPdfFile(file){
    selectedPdfFile = file || null;
    pdfPathInput.value = file ? file.name : '';
    resultPanel.hidden = true;
}

async function runArtworkRequest(){
    const file = selectedPdfFile;
    const inputPathValue = inputPath.value.trim();

    if(!inputPathValue){
        showResult('error', '작성 준비 필요', '입력 경로를 입력해 주세요.');
        inputPath.focus();
        return;
    }

    if(!file){
        showResult('error', '작성 준비 필요', 'PDF 파일을 끌어다 놓아 주세요.');
        pdfPathInput.focus();
        return;
    }

    runButton.disabled = true;
    inputPath.disabled = true;
    pdfPathInput.disabled = true;
    runButton.textContent = '작성 중...';
    showResult('running', '도안의뢰서 작성 중', 'PDF 파일을 전송하고 있습니다.');

    try{
        // 파일 업로드가 필요하므로 JSON이 아니라 FormData로 전송한다.
        const formData = new FormData();
        formData.append('inputPath', inputPathValue);
        formData.append('file', file);

        const response = await fetch('/api/artwork-request/run', {
            method:'POST',
            body:formData
        });

        if(!response.ok){
            throw new Error(await response.text() || '도안의뢰서 작성에 실패했습니다.');
        }

        const result = await response.json();
        showResult(
            'success',
            '도안의뢰서 작성 완료',
            result.resultPath || result.message || '도안의뢰서 엑셀을 생성했습니다.');
    }catch(error){
        showResult(
            'error',
            '도안의뢰서 작성 실패',
            friendlyFetchError(error, '도안의뢰서 작성에 실패했습니다.'));
    }finally{
        runButton.disabled = false;
        inputPath.disabled = false;
        pdfPathInput.disabled = false;
        runButton.textContent = '작성';
    }
}

function showResult(type, title, message){
    // 상태값은 RevisionPopup.css의 result-panel 스타일과 연결된다.
    resultPanel.hidden = false;
    resultPanel.dataset.status = type;
    statusIndicator.classList.toggle('is-running', type === 'running');
    resultTitle.textContent = title;
    resultMessage.textContent = message || '';
    resizeArtworkRequestPopupForResult();
}

function resizeArtworkRequestPopupForResult(){
    try{
        window.resizeTo(680, 680);
    }catch(error){
        // 브라우저가 팝업 크기 변경을 막으면 현재 창 크기를 그대로 사용한다.
    }
}

function friendlyFetchError(error, fallbackMessage){
    if(error instanceof TypeError
            || error.message === 'Failed to fetch'){
        return '서버와 연결이 끊겼습니다. 서버가 실행 중인지 확인한 뒤 다시 시도해 주세요.';
    }

    return error.message || fallbackMessage;
}
</script>
</body>
</html>
