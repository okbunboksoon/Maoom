<!DOCTYPE html>
<!-- 관리자 기능을 구현하기 위한 메인 화면. -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maoom 관리자</title>
    <link rel="stylesheet" href="/admin/sb-admin-2/vendor/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="/admin/sb-admin-2/vendor/datatables/dataTables.bootstrap4.min.css">
    <link rel="stylesheet" href="/admin/sb-admin-2/css/sb-admin-2.min.css">
    <link rel="stylesheet" href="/user/css/UserMain.css?v=font-align-4">
    <link rel="stylesheet" href="/user/css/AdminMain.css?v=sb-admin-2-11">
</head>
<body id="page-top" class="admin-main-body">

<div class="account-actions">
    <button id="accountMenuButton"
            class="current-user-name"
            type="button"
            aria-haspopup="dialog"
            aria-controls="accountDialog"
            onclick="openAccountDialog()">
        <span class="account-menu-avatar">
            <img id="accountMenuAvatarImage"
                 th:src="'/api/user/profile-image?userId=' + ${currentUserId}"
                 alt=""
                 onerror="this.hidden=true">
            <i class="fas fa-user"></i>
        </span>
        <strong id="currentUserName"
                th:text="${currentUserName} ?: '사용자'">사용자</strong>님
        <i class="fas fa-chevron-down account-chevron"></i>
    </button>
    <a class="admin-page-btn" href="/main">
        <i class="fas fa-house"></i>
        메인
    </a>
    <form class="logout-form" action="/logout" method="post">
        <button class="logout-btn" type="submit">
            <i class="fas fa-arrow-right-from-bracket"></i>
            로그아웃
        </button>
    </form>
</div>

<div id="accountDialogBackdrop"
     class="account-dialog-backdrop"
     hidden>
    <section id="accountDialog"
             class="account-dialog"
             role="dialog"
             aria-modal="true"
             aria-labelledby="accountDialogTitle">
        <div class="account-dialog-header">
            <div>
                <h2 id="accountDialogTitle">사용자 정보</h2>
                <p>이름과 비밀번호를 변경할 수 있습니다.</p>
            </div>
            <button class="account-close-btn"
                    type="button"
                    aria-label="닫기"
                    onclick="closeAccountDialog()">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <form id="accountForm">
            <div class="account-profile-editor">
                <span class="account-profile-preview">
                    <img id="accountProfilePreview"
                         th:src="'/api/user/profile-image?userId=' + ${currentUserId}"
                         alt="프로필 이미지"
                         onerror="this.hidden=true">
                    <i class="fas fa-user"></i>
                </span>
                <div class="account-profile-controls">
                    <strong>프로필 이미지</strong>
                    <span>PNG, JPG, GIF, WebP · 최대 5MB</span>
                    <div>
                        <label class="account-image-select-btn"
                               for="accountProfileFile">이미지 변경</label>
                        <input id="accountProfileFile"
                               type="file"
                               accept="image/png,image/jpeg,image/gif,image/webp"
                               hidden>
                        <button id="accountImageDeleteButton"
                                class="account-image-delete-btn"
                                type="button">삭제</button>
                    </div>
                </div>
            </div>
            <label class="account-field">
                <span>이름</span>
                <input id="accountUserName"
                       type="text"
                       maxlength="20"
                       th:value="${currentUserName}"
                       required>
            </label>

            <label class="account-field">
                <span>아이디</span>
                <input id="accountUserId"
                       type="text"
                       th:value="${currentUserId}"
                       readonly>
            </label>

            <label class="account-field">
                <span>현재 비밀번호</span>
                <input id="accountCurrentPassword"
                       type="password"
                       maxlength="72"
                       autocomplete="current-password"
                       placeholder="변경할 때만 입력">
            </label>

            <label class="account-field">
                <span>신규 비밀번호</span>
                <input id="accountNewPassword"
                       type="password"
                       minlength="6"
                       maxlength="72"
                       autocomplete="new-password"
                       placeholder="변경할 때만 입력">
                <small>입력하지 않으면 기존 비밀번호가 유지됩니다.</small>
            </label>

            <label class="account-field">
                <span>신규 비밀번호 확인</span>
                <input id="accountConfirmPassword"
                       type="password"
                       minlength="6"
                       maxlength="72"
                       autocomplete="new-password"
                       placeholder="신규 비밀번호 재입력">
                <small id="accountPasswordMatchMessage"
                       class="account-password-match-message"
                       aria-live="polite"></small>
            </label>

            <p id="accountFormError"
               class="account-form-error"
               role="alert"></p>

            <div class="account-dialog-actions">
                <button class="account-cancel-btn"
                        type="button"
                        onclick="closeAccountDialog()">취소</button>
                <button id="accountSaveButton"
                        class="account-save-btn"
                        type="submit">수정</button>
            </div>
        </form>
    </section>
</div>

<main class="admin-shell">
    <aside class="admin-sidebar sidebar" aria-label="관리자 DB 목록">
        <div class="admin-brand">
            <span class="admin-brand-mark">
                <i class="fas fa-database"></i>
            </span>
            <strong>Maoom Portal DB</strong>
        </div>
        <nav class="admin-db-nav">
            <button class="admin-db-nav-item active"
                    type="button"
                    data-admin-view="users">
                <i class="fas fa-users"></i>
                Maoom 정보 관리
            </button>
            <button class="admin-db-nav-item"
                    type="button"
                    data-admin-view="color-check">
                <i class="fas fa-palette"></i>
                HTML 도안 견적 DB
            </button>
            <button class="admin-db-nav-item"
                    type="button"
                    data-admin-view="ber-asis-tobe">
                <i class="fas fa-language"></i>
                BER DB
            </button>
            <button class="admin-db-nav-item"
                    type="button"
                    data-admin-view="qsg-db">
                <i class="fas fa-table"></i>
                QSG DB
            </button>
            <button class="admin-db-nav-item"
                    type="button"
                    data-admin-view="project-text-db">
                <i class="fas fa-font"></i>
                TEXT DB
            </button>
            <button class="admin-db-nav-item"
                    type="button"
                    data-admin-view="project-note-db">
                <i class="fas fa-sticky-note"></i>
                NOTE DB
            </button>
            <button class="admin-db-nav-item"
                    type="button"
                    data-admin-view="replace-dark-symbol">
                <i class="fas fa-image"></i>
                Replace Symbol DB
            </button>
            <button class="admin-db-nav-item"
                    type="button"
                    data-admin-view="project-logs">
                <i class="fas fa-clock-rotate-left"></i>
                실행 로그
            </button>
        </nav>
        <div class="admin-sidebar-toggle">
            <button id="sidebarToggle" type="button" aria-label="사이드바 접기">
                <i class="fas fa-angle-left"></i>
            </button>
        </div>
    </aside>

    <th:block th:replace="~{admin/section/colorCheck :: colorCheckSection}"></th:block>
    <th:block th:replace="~{admin/section/berAsisTobe :: berAsisTobeSection}"></th:block>
    <th:block th:replace="~{admin/section/qsgDb :: qsgDbSection}"></th:block>
    <th:block th:replace="~{admin/section/projectTextDb :: projectTextDbSection}"></th:block>
    <th:block th:replace="~{admin/section/projectNoteDb :: projectNoteDbSection}"></th:block>
    <th:block th:replace="~{admin/section/replaceDarkSymbol :: replaceDarkSymbolSection}"></th:block>
    <th:block th:replace="~{admin/section/projectLog :: projectLogSection}"></th:block>
    <th:block th:replace="~{admin/section/users :: usersSection}"></th:block>
</main>

<a class="scroll-to-top rounded" href="#page-top">
    <i class="fas fa-angle-up"></i>
</a>

<script src="/admin/sb-admin-2/vendor/jquery/jquery.min.js"></script>
<script src="/admin/sb-admin-2/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/admin/sb-admin-2/vendor/jquery-easing/jquery.easing.min.js"></script>
<script src="/admin/sb-admin-2/vendor/datatables/jquery.dataTables.min.js"></script>
<script src="/admin/sb-admin-2/vendor/datatables/dataTables.bootstrap4.min.js"></script>
<script src="/admin/js/adminMain.js?v=note-excel-import-1"></script>
<script src="/admin/sb-admin-2/js/sb-admin-2.min.js"></script>

</body>
</html>
