<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
    <!--
        관리자 > Replace Symbol DB 화면.

        데이터 흐름:
        - 목록 조회: static/admin/js/adminMain.js의 loadReplaceDarkSymbolItems()
          -> GET /admin/replace-dark-symbol/items
          -> AdminReplaceDarkSymbolController
          -> ReplaceDarkSymbolService
          -> tb_replace_dark_symbol

        의미:
        - From: 기존 이미지 심볼명. replace_dark_symbol.xml의 replace/@from.
        - To: 치환 후 심볼명. replace_dark_symbol.xml의 replace/@to.

        실행 흐름:
        - RevisionPipelineService, BerApplyService, MultilingualConversionService가
          배치 실행 직전 DB 내용을 xsl/replace_dark_symbol.xml로 다시 쓴다.

        수정 시 주의:
        - 테이블 컬럼 순서를 바꾸면 adminMain.js의 initReplaceDarkSymbolDataTable(),
          renderReplaceDarkSymbolTable(), AdminReplaceDarkSymbolController의 엑셀 export
          헤더도 같이 맞춰야 한다.
    -->
    <section th:fragment="replaceDarkSymbolSection"
             id="replaceDarkSymbolSection"
             class="admin-content"
             aria-label="replace dark symbol DB 테이블"
             hidden>
        <header class="admin-content-header">
            <div>
                <h1>Replace Symbol DB</h1>
                <p id="replaceDarkSymbolSummary">데이터를 불러오는 중입니다.</p>
            </div>
            <div class="admin-header-actions">
                <a class="admin-export-btn"
                   href="/admin/replace-dark-symbol/export">
                    <i class="fas fa-file-excel"></i>
                    엑셀 내보내기
                </a>
            </div>
        </header>

        <div class="admin-dashboard-cards">
            <article class="admin-stat-card border-left-primary">
                <div>
                    <span>전체 항목</span>
                    <strong id="replaceSymbolTotalCount">0</strong>
                </div>
                <i class="fas fa-database"></i>
            </article>
            <article class="admin-stat-card border-left-success">
                <div>
                    <span>치환 대상</span>
                    <strong id="replaceSymbolFromCount">0</strong>
                </div>
                <i class="fas fa-image"></i>
            </article>
            <article class="admin-stat-card border-left-info">
                <div>
                    <span>치환 결과</span>
                    <strong id="replaceSymbolToCount">0</strong>
                </div>
                <i class="fas fa-exchange-alt"></i>
            </article>
            <article class="admin-stat-card border-left-warning">
                <div>
                    <span>검색 결과</span>
                    <strong id="replaceSymbolFilteredCount">0</strong>
                </div>
                <i class="fas fa-filter"></i>
            </article>
        </div>

        <div class="card shadow mb-4 admin-table-card">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">Replace Symbol 목록</h6>
            </div>
            <div class="card-body">
                <div class="admin-table-tools">
                    <button id="replaceDarkSymbolRefresh"
                            class="admin-tool-btn"
                            type="button">
                        <i class="fas fa-sync-alt"></i>
                        새로고침
                    </button>
                </div>

                <div class="table-responsive">
                    <table id="replaceDarkSymbolTable"
                           class="table table-bordered admin-data-table"
                           width="100%"
                           cellspacing="0">
                        <thead>
                        <tr>
                            <th scope="col">No</th>
                            <th scope="col">From</th>
                            <th scope="col">To</th>
                            <th scope="col">수정일</th>
                            <th scope="col">관리</th>
                        </tr>
                        </thead>
                        <tbody id="replaceDarkSymbolTableBody">
                        <tr>
                            <td colspan="5" class="admin-empty-cell">
                                데이터를 불러오는 중입니다.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
