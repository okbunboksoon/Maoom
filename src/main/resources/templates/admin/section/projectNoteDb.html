<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
    <section th:fragment="projectNoteDbSection" id="projectNoteDbSection"
             class="admin-content project-db-section"
             data-project-db-type="note"
             aria-label="NOTE DB 테이블"
             hidden>
        <header class="admin-content-header">
            <div>
                <h1>NOTE DB</h1>
                <p id="projectNoteDbSummary">데이터를 불러오는 중입니다.</p>
            </div>
            <div class="admin-header-actions">
                <form id="projectNoteDbImportForm" class="admin-header-import-form">
                    <input id="projectNoteDbImportFile"
                           type="file"
                           accept=".xml,.xlsx,.xls,text/xml,application/xml,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel"
                           hidden>
                    <button id="projectNoteDbImportButton"
                            class="admin-tool-btn primary"
                            type="button">
                        <i class="fas fa-upload"></i>
                        XML/엑셀 업로드
                    </button>
                </form>
                <a class="admin-export-btn" href="/admin/project-note-db/export">
                    <i class="fas fa-file-excel"></i>
                    엑셀 내보내기
                </a>
            </div>
        </header>

        <div class="admin-dashboard-cards">
            <article class="admin-stat-card border-left-primary">
                <div><span>전체 항목</span><strong id="projectNoteTotalCount">0</strong></div>
                <i class="fas fa-database"></i>
            </article>
            <article class="admin-stat-card border-left-success">
                <div><span>EG</span><strong id="projectNoteEgCount">0</strong></div>
                <i class="fas fa-language"></i>
            </article>
            <article class="admin-stat-card border-left-warning">
                <div><span>KO</span><strong id="projectNoteKoCount">0</strong></div>
                <i class="fas fa-language"></i>
            </article>
            <article class="admin-stat-card border-left-success">
                <div><span>Warning</span><strong id="projectNoteWarningCount">0</strong></div>
                <i class="fas fa-triangle-exclamation"></i>
            </article>
            <article class="admin-stat-card border-left-warning">
                <div><span>Caution</span><strong id="projectNoteCautionCount">0</strong></div>
                <i class="fas fa-circle-exclamation"></i>
            </article>
            <article class="admin-stat-card border-left-danger">
                <div><span>Note</span><strong id="projectNoteNoteCount">0</strong></div>
                <i class="fas fa-note-sticky"></i>
            </article>
            <article class="admin-stat-card border-left-secondary">
                <div><span>Tip</span><strong id="projectNoteTipCount">0</strong></div>
                <i class="fas fa-note-sticky"></i>
            </article>
            <article class="admin-stat-card border-left-info">
                <div><span>검색 결과</span><strong id="projectNoteFilteredCount">0</strong></div>
                <i class="fas fa-filter"></i>
            </article>
        </div>

        <div class="card shadow mb-4 admin-table-card">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">NOTE DB 목록</h6>
            </div>
            <div class="card-body">
                <div class="admin-table-tools">
                    <button id="projectNoteDbRefresh" class="admin-tool-btn" type="button">
                        <i class="fas fa-sync-alt"></i>
                        새로고침
                    </button>
                </div>
                <div id="projectNoteDbImportResult" class="admin-import-result" hidden></div>
                <div class="table-responsive">
                    <table id="projectNoteDbTable" class="table table-bordered admin-data-table" width="100%" cellspacing="0">
                        <thead>
                        <tr>
                            <th scope="col">No</th>
                            <th scope="col">Region</th>
                            <th scope="col">Hash</th>
                            <th scope="col">Type</th>
                            <th scope="col">Text</th>
                            <th scope="col">수정일</th>
                            <th scope="col">관리</th>
                        </tr>
                        </thead>
                        <tbody id="projectNoteDbTableBody">
                        <tr><td colspan="7" class="admin-empty-cell">데이터를 불러오는 중입니다.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
